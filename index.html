<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>直播海报工作流 · 操作面板</title>
<style>
  :root {
    --blue: #2563EB;
    --blue-light: #EFF6FF;
    --blue-border: #BFDBFE;
    --green: #16A34A;
    --green-light: #F0FDF4;
    --orange: #D97706;
    --orange-light: #FFFBEB;
    --gray-50: #F8FAFC;
    --gray-100: #F1F5F9;
    --gray-200: #E2E8F0;
    --gray-400: #94A3B8;
    --gray-500: #64748B;
    --gray-700: #334155;
    --gray-900: #0F172A;
    --red: #DC2626;
    --radius: 10px;
    --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
    --shadow-md: 0 4px 12px rgba(0,0,0,.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    background: var(--gray-50);
    color: var(--gray-900);
    font-size: 14px;
    line-height: 1.6;
  }

  /* ── Header ── */
  .header {
    background: white;
    border-bottom: 1px solid var(--gray-200);
    padding: 0 24px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .logo { font-size: 20px; }
  .header-title { font-size: 16px; font-weight: 600; color: var(--gray-900); }
  .header-badge {
    background: var(--blue-light);
    color: var(--blue);
    font-size: 12px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 20px;
    border: 1px solid var(--blue-border);
  }
  .header-issue {
    font-size: 13px;
    color: var(--gray-500);
  }
  .header-issue span { font-weight: 600; color: var(--blue); }

  /* ── Layout ── */
  .main {
    max-width: 1280px;
    margin: 0 auto;
    padding: 20px 24px;
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 20px;
    align-items: start;
  }
  .left-col { display: flex; flex-direction: column; gap: 16px; }
  .right-col { display: flex; flex-direction: column; gap: 16px; position: sticky; top: 76px; }

  /* ── Card ── */
  .card {
    background: white;
    border: 1px solid var(--gray-200);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .card-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--gray-200);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--gray-50);
  }
  .card-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--gray-700);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .card-body { padding: 16px; }

  /* ── Form ── */
  .form-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-field { display: flex; flex-direction: column; gap: 4px; }
  .form-field label {
    font-size: 12px;
    font-weight: 500;
    color: var(--gray-500);
    text-transform: uppercase;
    letter-spacing: .4px;
  }
  .form-field input, .form-field select, .form-field textarea {
    border: 1px solid var(--gray-200);
    border-radius: 6px;
    padding: 7px 10px;
    font-size: 14px;
    color: var(--gray-900);
    font-family: inherit;
    transition: border-color .15s, box-shadow .15s;
    background: white;
    width: 100%;
  }
  .form-field input:focus, .form-field select:focus, .form-field textarea:focus {
    outline: none;
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(37,99,235,.1);
  }
  .form-field textarea { resize: vertical; min-height: 72px; }

  /* ── Assistants ── */
  .assistant-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 4px;
  }
  .assistant-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px 5px 8px;
    border: 1.5px solid var(--gray-200);
    border-radius: 20px;
    cursor: pointer;
    transition: all .15s;
    user-select: none;
    font-size: 13px;
    background: white;
  }
  .assistant-chip:hover { border-color: var(--blue); }
  .assistant-chip.selected {
    border-color: var(--blue);
    background: var(--blue-light);
    color: var(--blue);
  }
  .assistant-chip.locked {
    border-color: var(--gray-200);
    background: var(--gray-100);
    color: var(--gray-500);
    cursor: default;
    opacity: .7;
  }
  .assistant-chip .num {
    font-size: 11px;
    font-weight: 700;
    padding: 1px 5px;
    border-radius: 10px;
    background: currentColor;
    color: white;
    opacity: .85;
  }
  .assistant-chip.selected .num { background: var(--blue); opacity: 1; color: white; }
  .color-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* ── Commands ── */
  .cmd-list { display: flex; flex-direction: column; gap: 12px; }
  .cmd-block {
    border: 1px solid var(--gray-200);
    border-radius: 8px;
    overflow: hidden;
  }
  .cmd-block-header {
    padding: 8px 12px;
    background: var(--gray-50);
    border-bottom: 1px solid var(--gray-200);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .cmd-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--gray-700);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .step-badge {
    font-size: 10px;
    font-weight: 700;
    color: var(--gray-400);
    background: var(--gray-100);
    padding: 1px 6px;
    border-radius: 10px;
  }
  .cmd-code {
    font-family: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    font-size: 12px;
    line-height: 1.7;
    padding: 12px;
    background: #1E293B;
    color: #E2E8F0;
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 200px;
    overflow-y: auto;
  }
  .cmd-preview {
    font-family: inherit;
    font-size: 13px;
    line-height: 1.7;
    padding: 12px;
    background: #FAFAFA;
    color: var(--gray-700);
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 200px;
    overflow-y: auto;
    border-top: 1px dashed var(--gray-200);
    display: none;
  }
  .copy-btn {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px 10px;
    background: white;
    border: 1px solid var(--gray-200);
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 500;
    color: var(--gray-700);
    transition: all .15s;
  }
  .copy-btn:hover { background: var(--blue-light); border-color: var(--blue); color: var(--blue); }
  .copy-btn.copied { background: var(--green-light); border-color: var(--green); color: var(--green); }

  /* ── Checklist ── */
  .checklist { display: flex; flex-direction: column; gap: 2px; }
  .check-item {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 7px 8px;
    border-radius: 6px;
    cursor: pointer;
    transition: background .1s;
  }
  .check-item:hover { background: var(--gray-50); }
  .check-item.done .check-text { text-decoration: line-through; color: var(--gray-400); }
  .check-box {
    width: 16px; height: 16px;
    border: 1.5px solid var(--gray-300);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 2px;
    transition: all .15s;
  }
  .check-item.done .check-box {
    background: var(--green);
    border-color: var(--green);
  }
  .check-tick { display: none; color: white; font-size: 10px; font-weight: 700; }
  .check-item.done .check-tick { display: block; }
  .check-text { font-size: 13px; color: var(--gray-700); line-height: 1.4; }
  .check-step { font-size: 11px; color: var(--gray-400); font-weight: 600; }

  /* ── Reference ── */
  .ref-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .ref-table th {
    background: var(--gray-50);
    padding: 6px 8px;
    text-align: left;
    font-weight: 600;
    color: var(--gray-500);
    border-bottom: 1px solid var(--gray-200);
  }
  .ref-table td {
    padding: 6px 8px;
    border-bottom: 1px solid var(--gray-100);
    color: var(--gray-700);
    vertical-align: middle;
  }
  .ref-table tr:last-child td { border-bottom: none; }
  .id-mono {
    font-family: monospace;
    font-size: 10px;
    color: var(--gray-500);
    cursor: pointer;
    padding: 1px 4px;
    border-radius: 3px;
    border: 1px solid var(--gray-200);
    background: var(--gray-50);
  }
  .id-mono:hover { background: var(--blue-light); border-color: var(--blue); color: var(--blue); }

  /* ── Color chips ── */
  .chip-red { color: #B91C1C; background: #FEF2F2; }
  .chip-green { color: #15803D; background: #F0FDF4; }
  .chip-pink { color: #BE185D; background: #FDF2F8; }
  .chip-yellow { color: #92400E; background: #FFFBEB; }
  .chip-teal { color: #0E7490; background: #F0FDFA; }
  .color-chip {
    font-size: 11px;
    padding: 1px 6px;
    border-radius: 10px;
    font-weight: 500;
  }

  /* ── Chat IDs ── */
  .chat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0;
    border-bottom: 1px solid var(--gray-100);
  }
  .chat-row:last-child { border-bottom: none; }
  .chat-name { font-size: 13px; color: var(--gray-700); }

  /* ── Progress bar ── */
  .progress-bar {
    height: 3px;
    background: var(--gray-200);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 8px;
  }
  .progress-fill {
    height: 100%;
    background: var(--green);
    border-radius: 2px;
    transition: width .3s;
  }
  .progress-label {
    font-size: 11px;
    color: var(--gray-400);
    margin-top: 4px;
    text-align: right;
  }

  .divider { height: 1px; background: var(--gray-100); margin: 8px 0; }
  .section-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--gray-400);
    text-transform: uppercase;
    letter-spacing: .5px;
    padding: 8px 0 4px;
  }

  /* ── Placeholder state ── */
  .placeholder-text {
    color: var(--gray-400);
    font-style: italic;
  }
  .missing { background: #FEF9C3 !important; }

  /* ── Responsive ── */
  @media (max-width: 900px) {
    .main { grid-template-columns: 1fr; }
    .right-col { position: static; }
    .form-grid { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 600px) {
    .main { padding: 12px; }
    .form-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <span class="logo">🎬</span>
    <span class="header-title">直播海报工作流</span>
    <span class="header-badge">操作面板</span>
  </div>
  <div class="header-issue">当前期数：<span id="header-issue-num">—</span></div>
</div>

<div class="main">
  <!-- ══════════ LEFT COLUMN ══════════ -->
  <div class="left-col">

    <!-- 参数配置 -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">⚙️ 本期参数配置</span>
        <button onclick="clearAll()" style="font-size:12px;color:var(--gray-400);background:none;border:none;cursor:pointer;">清空</button>
      </div>
      <div class="card-body" style="display:flex;flex-direction:column;gap:14px;">

        <div class="form-grid">
          <div class="form-field">
            <label>期数</label>
            <input type="number" id="f-issue" placeholder="如 453" oninput="update()">
          </div>
          <div class="form-field">
            <label>直播月日</label>
            <input type="text" id="f-monthday" placeholder="如 6月5日" oninput="update()">
          </div>
          <div class="form-field">
            <label>星期</label>
            <select id="f-weekday" onchange="update()">
              <option value="周二">周二</option>
              <option value="周四">周四</option>
              <option value="周五">周五</option>
            </select>
          </div>
        </div>

        <div class="form-grid-2">
          <div class="form-field">
            <label>直播链接</label>
            <input type="text" id="f-link" placeholder="https://..." oninput="update()">
          </div>
          <div class="form-field">
            <label>关键词（date_code）</label>
            <input type="text" id="f-datecode" placeholder="如 20260602" oninput="update()">
          </div>
        </div>

        <div class="form-field">
          <label>直播标题</label>
          <input type="text" id="f-title" placeholder="如 螺丝钉星级是什么，投资的时候如何用？" oninput="update()">
        </div>

        <div class="form-field">
          <label>推广文案（每条一行）</label>
          <textarea id="f-captions" placeholder="什么是螺丝钉星级评级？&#10;为什么不能只看星级买基金？&#10;如何结合星级做投资决策？" oninput="update()"></textarea>
        </div>

        <div class="form-grid-2">
          <div class="form-field">
            <label>回放文章安排</label>
            <input type="text" id="f-replay" placeholder="如：直播当天发布" oninput="update()">
          </div>
          <div class="form-field">
            <label>翻写文章安排</label>
            <input type="text" id="f-fanxie" placeholder="如：直播后一周" oninput="update()">
          </div>
        </div>

        <!-- 小助手选择 -->
        <div>
          <div class="section-label">小助手配置（5号、6号常驻；3号/7号轮换）</div>
          <div class="assistant-grid" id="assistant-chips">
            <!-- rendered by JS -->
          </div>
        </div>

      </div>
    </div>

    <!-- 生成的命令 -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">📋 生成的命令</span>
        <button onclick="copyAll()" class="copy-btn" id="copy-all-btn">📄 一键复制全部</button>
      </div>
      <div class="card-body">
        <div class="cmd-list" id="cmd-list">
          <!-- rendered by JS -->
        </div>
      </div>
    </div>

  </div><!-- /left-col -->

  <!-- ══════════ RIGHT COLUMN ══════════ -->
  <div class="right-col">

    <!-- 工作流进度 -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">✅ 工作流进度</span>
        <button onclick="resetChecks()" style="font-size:12px;color:var(--gray-400);background:none;border:none;cursor:pointer;">重置</button>
      </div>
      <div class="card-body" style="padding:12px 16px;">
        <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
        <div class="progress-label" id="progress-label">0 / 13 步完成</div>
        <div class="checklist" id="checklist" style="margin-top:8px;">
          <!-- rendered by JS -->
        </div>
      </div>
    </div>

    <!-- 参考：小助手表 -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">👥 小助手人员表</span>
      </div>
      <div class="card-body" style="padding:8px 0;">
        <table class="ref-table">
          <thead>
            <tr>
              <th>编号</th>
              <th>昵称</th>
              <th>飞书名</th>
              <th>颜色</th>
              <th>open_id（点击复制）</th>
            </tr>
          </thead>
          <tbody id="assistant-table"><!-- rendered by JS --></tbody>
        </table>
      </div>
    </div>

    <!-- 参考：常用群 ID -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">💬 常用群 ID</span>
      </div>
      <div class="card-body">
        <div id="chat-ids"><!-- rendered by JS --></div>
      </div>
    </div>

  </div><!-- /right-col -->
</div>

<script>
// ═══════════════════════════════════════
//  DATA
// ═══════════════════════════════════════
const ASSISTANTS = [
  { num: '1', name: '李菁', lark: '李菁',   id: 'ou_93a19e195953359b82d943d7dff11b87', color: '红色',  colorClass: 'chip-red',    dotColor: '#EF4444', locked: true,  alwaysOn: true,  needAt: false },
  { num: '5', name: '亚芳',  lark: '杜亚芳', id: 'ou_edb1b102186805f9e1d0a41dd2eae6e8', color: '绿色',  colorClass: 'chip-green',  dotColor: '#22C55E', locked: false, alwaysOn: true,  needAt: true  },
  { num: '6', name: '伞伞',  lark: '食米马伞',id: 'ou_d62113f91cb152e6424966002d9a96ed', color: '粉色',  colorClass: 'chip-pink',   dotColor: '#EC4899', locked: false, alwaysOn: true,  needAt: true  },
  { num: '3', name: '汤',    lark: '汤爱学', id: 'ou_e9a6dd9bd4ab1b8d65452635ef70c953', color: '西柚色',colorClass: 'chip-yellow', dotColor: '#F59E0B', locked: false, alwaysOn: false, needAt: true  },
  { num: '7', name: '范丽丽',lark: '范丽丽', id: 'ou_2bd618ee347cc81fe4f1832ef1f35c91', color: '青色',  colorClass: 'chip-teal',   dotColor: '#14B8A6', locked: false, alwaysOn: false, needAt: true  },
];

const CHATS = [
  { name: '螺丝钉团队群',   id: 'oc_fcace7d6268518d54ed1998b29764543' },
  { name: 'PPT制作群',      id: 'oc_918c9be8ab6950e746bc308c8c32a334' },
  { name: '226课程群',      id: 'oc_ad278b7a15d31ab7a5ced19569769db8' },
  { name: '内容小分队群',   id: 'oc_d49775cef6a606b893cdec743875be02' },
];

const STEPS = [
  '收到直播链接 + 大纲文档链接',
  '解析直播信息（标题、期数、文案）',
  '从大纲文档提取回放/翻写安排',
  '从排期表匹配小助手，生成四部分物料',
  '插入飞书物料文档',
  '等待用户确认物料',
  '发内容小分队 @汤爱学 复核',
  '等待汤爱学确认',
  '发 PPT制作群 @胡亮 配置信息',
  '轮询等待胡亮发三张二维码（check_qr_codes.py）',
  '生成6张海报',
  '展示海报给用户确认',
  '上传飞书共享文档 + 通知胡亮/郭凤强',
  '发226课程群通知李菁（两条消息+学院海报）',
  '创建螺丝钉团队定时任务（直播当天17:00）',
  '更新 SKILL.md 最新期数',
];

// ═══════════════════════════════════════
//  STATE
// ═══════════════════════════════════════
let selected = { '1': true, '5': true, '6': true, '3': false, '7': false };
let checks = JSON.parse(localStorage.getItem('lp-checks') || '{}');

function getVal(id) { return document.getElementById(id)?.value?.trim() || ''; }

function getState() {
  const issue = getVal('f-issue');
  const monthday = getVal('f-monthday');   // "6月2日"
  const weekday = getVal('f-weekday');      // "周二"
  const link = getVal('f-link');
  const title = getVal('f-title');
  const captions = getVal('f-captions').split('\n').filter(l => l.trim());
  const datecode = getVal('f-datecode');
  const replay = getVal('f-replay');
  const fanxie = getVal('f-fanxie');

  // month.day → "6.2"
  const mday = monthday.replace(/月/, '.').replace(/日/, '');
  // full year date → "2026年6月2日"
  const now = new Date();
  const yearStr = '2026年' + monthday;

  const activeAssistants = ASSISTANTS.filter(a => selected[a.num]);
  const assistantNums = activeAssistants.map(a => a.num + '号').join('、');

  return { issue, monthday, weekday, link, title, captions, datecode, replay, fanxie, mday, yearStr, activeAssistants, assistantNums };
}

// ═══════════════════════════════════════
//  INIT UI
// ═══════════════════════════════════════
function initAssistantChips() {
  const container = document.getElementById('assistant-chips');
  container.innerHTML = '';
  ASSISTANTS.forEach(a => {
    const chip = document.createElement('div');
    chip.className = 'assistant-chip' + (selected[a.num] ? ' selected' : '') + (a.locked ? ' locked' : '');
    chip.innerHTML = `<span class="num">${a.num}</span><span class="color-dot" style="background:${a.dotColor}"></span>${a.name}<span class="color-chip ${a.colorClass}" style="margin-left:2px;font-size:10px;padding:0 5px;border-radius:10px;">${a.color}</span>`;
    if (!a.locked) {
      chip.onclick = () => {
        selected[a.num] = !selected[a.num];
        initAssistantChips();
        update();
      };

function initChecklist() {
  const container = document.getElementById('checklist');
  container.innerHTML = STEPS.map((s, i) => {
    const done = !!checks[i];
    return `<div class="check-item ${done ? 'done' : ''}" onclick="toggleCheck(${i})" id="check-${i}">

      <div>
        <div class="check-step">步骤 ${i+1}</div>
        <div class="check-text">${s}</div>
      </div>
    </div>`;
  }).join('');
  updateProgress();
}

function toggleCheck(i) {
  checks[i] = !checks[i];
  localStorage.setItem('lp-checks', JSON.stringify(checks));
  const item = document.getElementById('check-' + i);
  item.classList.toggle('done', checks[i]);
  updateProgress();
}

function updateProgress() {
  const done = Object.values(checks).filter(Boolean).length;
  const total = STEPS.length;
  const pct = Math.round(done / total * 100);
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-label').textContent = `${done} / ${total} 步完成`;
}

function resetChecks() {
  checks = {};
  localStorage.removeItem('lp-checks');
  initChecklist();
}

//  RENDER COMMANDS
// ═══════════════════════════════════════
function renderCmds(cmds) {
  const container = document.getElementById('cmd-list');
  container.innerHTML = '';
  cmds.forEach((cmd, i) => {
    const block = document.createElement('div');
    block.className = 'cmd-block';
    const hasPreview = !!cmd.preview;
    block.innerHTML = `
      <div class="cmd-block-header">
        <span class="cmd-label">
          <span>${cmd.icon}</span>
          ${cmd.label}
          <span class="step-badge">${cmd.step}</span>
        </span>
        <div style="display:flex;gap:6px;align-items:center;">
          ${hasPreview ? `<button onclick="togglePreview(${i})" class="copy-btn" id="prev-btn-${i}">👁 预览</button>` : ''}
          <button onclick="copyCmd(${i})" class="copy-btn" id="copy-btn-${i}">复制</button>
        </div>
      </div>
      <pre class="cmd-code" id="cmd-code-${i}">${escHtml(cmd.code)}</pre>
      ${hasPreview ? `<div class="cmd-preview" id="cmd-prev-${i}">${escHtml(cmd.preview)}</div>` : ''}
    `;
    container.appendChild(block);
  });
}

let allCmds = [];

function update() {
  const s = getState();
  document.getElementById('header-issue-num').textContent = s.issue || '—';
  allCmds = buildCmds(s);
  renderCmds(allCmds);
}

function togglePreview(i) {
  const prev = document.getElementById('cmd-prev-' + i);
  const btn = document.getElementById('prev-btn-' + i);
  const visible = prev.style.display === 'block';
  prev.style.display = visible ? 'none' : 'block';
  btn.textContent = visible ? '👁 预览' : '👁 收起';
}

// ═══════════════════════════════════════
//  COPY HELPERS
// ═══════════════════════════════════════
function copyText(text, el) {
  navigator.clipboard.writeText(text).then(() => {
    const orig = el.textContent;
    el.textContent = '已复制!';
    el.style.background = '#D1FAE5';
    el.style.color = '#065F46';
    setTimeout(() => {
      el.textContent = orig;
      el.style.background = '';
      el.style.color = '';
    }, 1500);
  });
}

function copyCmd(i) {
  const code = allCmds[i].code;
  navigator.clipboard.writeText(code).then(() => {
    const btn = document.getElementById('copy-btn-' + i);
    btn.textContent = '✓ 已复制';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = '复制';
      btn.classList.remove('copied');
    }, 2000);
  });
}

function copyAll() {
  const all = allCmds.map((c, i) => `# ── ${c.step}: ${c.label} ──\n${c.code}`).join('\n\n');
  navigator.clipboard.writeText(all).then(() => {
    const btn = document.getElementById('copy-all-btn');
    btn.textContent = '✓ 已全部复制';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = '📄 一键复制全部';
      btn.classList.remove('copied');
    }, 2500);
  });
}

function clearAll() {
  ['f-issue','f-monthday','f-link','f-title','f-captions','f-datecode','f-replay','f-fanxie'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
  document.getElementById('f-weekday').value = '周二';
  selected = { '1': true, '5': true, '6': true, '3': false, '7': false };
  initAssistantChips();
  update();
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
